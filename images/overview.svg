<svg viewBox="0 0 920 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#eef2f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#1b1f24" flood-opacity="0.14"/>
    </filter>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2e7d32"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f6feb"/>
    </marker>

    <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="#2e7d32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/></g></symbol>
    <symbol id="i-window" viewBox="0 0 24 24"><g fill="none" stroke="#2e7d32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><line x1="3.5" y1="9" x2="20.5" y2="9"/></g><circle cx="6.4" cy="6.7" r="0.8" fill="#2e7d32"/><circle cx="9" cy="6.7" r="0.8" fill="#2e7d32"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><g fill="none" stroke="#d1242f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5 L20.5 19 H3.5 Z"/><line x1="12" y1="10" x2="12" y2="14"/></g><circle cx="12" cy="16.4" r="1" fill="#d1242f"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><g fill="none" stroke="#2e7d32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8 H18.5 L17.5 19.5 H6.5 Z"/><path d="M8.8 8 V6.6 a3.2 3.2 0 0 1 6.4 0 V8"/></g></symbol>
    <symbol id="i-flow" viewBox="0 0 24 24"><g fill="none" stroke="#2e7d32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="6.5" r="2.4"/><circle cx="18" cy="17.5" r="2.4"/><line x1="8.2" y1="10.8" x2="15.8" y2="7.4"/><line x1="8.2" y1="13.2" x2="15.8" y2="16.6"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="#2e7d32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><path d="M7.8 12.4 l2.9 2.9 L16.4 9.4"/></g></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><g fill="none" stroke="#1f6feb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7 C10 5.6 7.2 5.4 4.5 6 V18.4 C7.2 17.8 10 18 12 19.4"/><path d="M12 7 C14 5.6 16.8 5.4 19.5 6 V18.4 C16.8 17.8 14 18 12 19.4"/></g></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><g fill="none" stroke="#1f6feb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6.4" rx="6.8" ry="2.6"/><path d="M5.2 6.4 V17.6 C5.2 19 8.3 20.2 12 20.2 S18.8 19 18.8 17.6 V6.4"/><path d="M5.2 12 C5.2 13.4 8.3 14.6 12 14.6 S18.8 13.4 18.8 12"/></g></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><g fill="none" stroke="#8250df" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 L19.5 6.2 V11 c0 4.8-3.3 7.6-7.5 9.3 C7.8 18.6 4.5 15.8 4.5 11 V6.2 Z"/><path d="M8.7 12 l2.2 2.2 L15.3 9.6"/></g></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><line x1="4" y1="19.5" x2="20.5" y2="19.5" fill="none" stroke="#2e7d32" stroke-width="1.8" stroke-linecap="round"/><g fill="#2e7d32"><rect x="6" y="12" width="2.8" height="7.5" rx="0.5"/><rect x="10.6" y="8" width="2.8" height="11.5" rx="0.5"/><rect x="15.2" y="14" width="2.8" height="5.5" rx="0.5"/></g></symbol>
  </defs>

  <rect width="920" height="600" fill="#ffffff"/>

  <text x="460" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1b1f24">ServiceNow ITSM Build</text>
  <text x="460" y="56" text-anchor="middle" font-size="12.5" fill="#57606a">The path a request takes, from a user submitting it to a resolved, documented ticket</text>

  <!-- instance panel -->
  <rect x="16" y="74" width="888" height="508" rx="16" fill="url(#panel)" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="34" y="102" font-size="12.5" font-weight="600" fill="#57606a">ServiceNow Personal Developer Instance</text>

  <!-- legend -->
  <line x1="628" y1="94" x2="656" y2="94" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
  <text x="662" y="98" font-size="11" fill="#57606a">request journey</text>
  <line x1="628" y1="110" x2="656" y2="110" stroke="#1f6feb" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ab)"/>
  <text x="662" y="114" font-size="11" fill="#57606a">backing data (knowledge &amp; configuration)</text>

  <!-- boxes -->
  <rect x="34"  y="193" width="132" height="84" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="196" y="193" width="132" height="84" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="374" y="123" width="132" height="84" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="374" y="263" width="132" height="84" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="550" y="263" width="140" height="84" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="734" y="193" width="132" height="84" rx="10" fill="#eaf7ee" stroke="#2e7d32" stroke-width="1.6" filter="url(#shadow)"/>

  <rect x="196" y="112" width="132" height="68" rx="10" fill="#eef5fd" stroke="#1f6feb" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="645" y="400" width="150" height="70" rx="10" fill="#eef5fd" stroke="#1f6feb" stroke-width="1.5" filter="url(#shadow)"/>

  <rect x="34"  y="502" width="470" height="58" rx="10" fill="#f5edff" stroke="#8250df" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="540" y="502" width="330" height="58" rx="10" fill="#e9f6ee" stroke="#2e7d32" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- journey arrows -->
  <line x1="166" y1="235" x2="192" y2="235" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M328 222 Q352 180 371 172" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M328 250 Q352 292 371 300" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="506" y1="305" x2="547" y2="305" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M690 288 Q716 250 733 243" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M506 172 Q620 178 732 214" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>

  <!-- backing data arrows -->
  <line x1="328" y1="152" x2="372" y2="160" stroke="#1f6feb" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ab)"/>
  <line x1="720" y1="400" x2="784" y2="279" stroke="#1f6feb" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ab)"/>

  <!-- icons -->
  <use href="#i-user"   x="85"  y="205" width="30" height="30"/>
  <use href="#i-window" x="247" y="205" width="30" height="30"/>
  <use href="#i-alert"  x="425" y="135" width="30" height="30"/>
  <use href="#i-bag"    x="425" y="275" width="30" height="30"/>
  <use href="#i-flow"   x="605" y="275" width="30" height="30"/>
  <use href="#i-check"  x="785" y="205" width="30" height="30"/>
  <use href="#i-book"   x="248" y="120" width="28" height="28"/>
  <use href="#i-db"     x="706" y="408" width="28" height="28"/>
  <use href="#i-shield" x="52"  y="517" width="28" height="28"/>
  <use href="#i-chart"  x="558" y="517" width="28" height="28"/>

  <!-- box labels -->
  <text x="100" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f24">End User</text>

  <text x="262" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f24">Service Portal</text>
  <text x="262" y="267" text-anchor="middle" font-size="9.5" fill="#57606a">self-service</text>

  <text x="440" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f24">Incident</text>
  <text x="440" y="197" text-anchor="middle" font-size="9.5" fill="#57606a">log · assign · resolve</text>

  <text x="440" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f24">Service Request</text>
  <text x="440" y="337" text-anchor="middle" font-size="9.5" fill="#57606a">from the catalog</text>

  <text x="620" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f24">Flow Designer</text>
  <text x="620" y="337" text-anchor="middle" font-size="9.5" fill="#2e7d32">approval &amp; fulfillment</text>

  <text x="800" y="249" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f24">Resolved &amp;</text>
  <text x="800" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f24">Documented</text>

  <text x="262" y="156" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b1f24">Knowledge Base</text>
  <text x="262" y="170" text-anchor="middle" font-size="9" fill="#57606a">common fixes, procedures</text>

  <text x="720" y="450" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1b1f24">CMDB</text>
  <text x="720" y="464" text-anchor="middle" font-size="9" fill="#57606a">configuration items</text>

  <!-- band labels -->
  <text x="92"  y="527" font-size="13" font-weight="600" fill="#1b1f24">Role-Based Access Control</text>
  <text x="92"  y="544" font-size="9.5" fill="#57606a">users, groups, roles · who can see and do what</text>

  <text x="598" y="527" font-size="13" font-weight="600" fill="#1b1f24">Dashboard &amp; Reports</text>
  <text x="598" y="544" font-size="9.5" fill="#57606a">live incident and request queue</text>
</svg>
